<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>help-desk</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--HEADER-->
    <header class="header"> <img src="assets/logo help desk.png" width="200"> <span>Atlas Solutions / Support</span>
    </header>
    <main>
        <section class="section1">
            <h1>Gestion des demandes</h1>
            <p>Centralisez les incidents et simplifiez le suivi de votre équipe.</p>
            <div class="ajoute">

                <h3>Créer une demande</h3>
                <p>Décrivez votre problème informatique en quelques étapes.</p>

                <!--formulaire demander-->

                <form class="formulaire" id="formulaire-demande">

                    <div class="problem">
                        <label for="titre">Titre du problème *</label>
                        <input type="text" id="titre" placeholder="Connexion Wi-Fi instable" required>
                    </div>

                    <div class="problem">
                        <label for="categorie">Catégorie *</label>

                        <select id="categorie" required>
                            <option value="">Choisir une categorie</option>
                            <option value="Matériel">Matériel</option>
                            <option value="Logiciel">Logiciel</option>
                            <option value="Réseau">Réseau</option>
                        </select>
                    </div>

                    <div class="problem">
                        <label for="priorite">Priorité *</label>

                        <select id="priorite" required>
                            <option value="">Choisir une priorite</option>
                            <option value="Basse">Basse</option>
                            <option value="Normale">Normale</option>
                            <option value="Haute">Haute</option>
                        </select>
                    </div>

                    <div class="problem-description">
                        <label for="description">Description *</label>

                        <textarea id="description" placeholder="Décrivez le problème informatique..."
                            required></textarea>
                    </div>

                    <div class="btn">
                        <button type="submit" id="btn">
                            ＋ Ajouter la demande
                        </button>
                    </div>

                </form>

            </div>
        </section>
        <section class="section2">

            <div class="liste">

                <div>
                    <h2>Liste des demandes</h2>
                    <p id="compteur">3 demandes</p>
                </div>

                <div class="choix">
                    <button type="button">▦ Cartes</button>
                    <button type="button">☷ Tableau</button>
                </div>

            </div>

            <div class="cartes" id="cartes"></div>

        </section>


    </main>

        <script src="script.js"></script>
</body>

</html>
